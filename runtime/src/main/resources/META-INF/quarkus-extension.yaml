name: Quarkus Debian Packaging
description: >
  Build a Debian package (.deb) for Quarkus applications during package phase.
  Add this extension and run `mvn package` — no jdeb/pom plugins required.
  Payload follows quarkus.package.jar.type / native packaging automatically.
